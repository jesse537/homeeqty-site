# Plain static site: no build step, publish the repo root as is.
[build]
  publish = "."
  command = "echo no build step"

# Serve llms.txt as UTF-8 plain text so AI crawlers read it cleanly.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Mail test: printed card URLs, in case someone types a capital letter.
[[redirects]]
  from = "/mail/A"
  to = "/mail/a/"
  status = 301
[[redirects]]
  from = "/mail/B"
  to = "/mail/b/"
  status = 301
[[redirects]]
  from = "/mail/C"
  to = "/mail/c/"
  status = 301
